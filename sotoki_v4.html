<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SotoKi">
<title>SotoKi v4</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- uPlot CSS/JS（v1.6.32 同梱。CDN配信されていないためセルフホスト） -->
<link rel="stylesheet" href="vendor/uPlot.min.css">
<script src="vendor/uPlot.iife.min.js"></script>

<style>
/* ============================================================
   BASE & TYPOGRAPHY
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap');

:root {
  --bg: #f5f4f0;
  --bg2: #eceae3;
  --surface: #ffffff;
  --border: #d4d0c8;
  --text: #1a1a1a;
  --text2: #555;
  --text3: #999;

  --a-col: #2a7d4f;   /* 緑 */
  --b-col: #e8a020;   /* 橙 */
  --c-col: #d03030;   /* 赤 */

  --rain-col: #3a7fc1;
  --snow-col: #7bb8e8;
  --wind-col: #6c5ce7;
  --press-col: #888;

  --sky-dawn:  #f9a875;
  --sky-day:   #87ceeb;
  --sky-cloud: #bcc4cc;
  --sky-night: #0d1b3e;

  --radius: 14px;
  --font-display: 'Bebas Neue', sans-serif;
  --font-ui: 'Noto Sans JP', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--surface);
  position: relative;
  overflow: hidden;
}

/* ============================================================
   HEADER
   ============================================================ */
#header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 8px;
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

#app-logo {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: 2px;
  color: var(--text);
  line-height: 1;
}
#app-version {
  font-size: 9px;
  font-family: var(--font-mono);
  color: var(--text3);
  align-self: flex-end;
  padding-bottom: 3px;
}

#location-name {
  flex: 1;
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mode-toggle {
  display: flex;
  background: var(--bg2);
  border-radius: 20px;
  padding: 2px;
  gap: 2px;
}
.mode-btn {
  font-size: 10px;
  font-weight: 700;
  padding: 4px 9px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 18px;
  color: var(--text2);
  transition: all 0.2s;
  font-family: var(--font-ui);
}
.mode-btn.active {
  background: var(--text);
  color: #fff;
}

/* ============================================================
   DAY SELECTOR
   ============================================================ */
#day-selector {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  flex-shrink: 0;
}
.day-tab {
  flex: 1;
  text-align: center;
  padding: 7px 4px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text3);
  position: relative;
  transition: color 0.15s;
  font-family: var(--font-ui);
}
.day-tab.active {
  color: var(--text);
}
.day-tab.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 10%;
  width: 80%;
  height: 3px;
  background: var(--text);
  border-radius: 2px;
}

/* ============================================================
   HUD – 大型数値表示
   ============================================================ */
#hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px 4px;
  background: var(--bg2);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
}
.hud-val {
  font-family: var(--font-display);
  font-size: 38px;
  letter-spacing: 1px;
  line-height: 1;
}
.hud-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: 1px;
  margin-top: 2px;
}
.hud-time {
  font-family: var(--font-mono);
  font-size: 30px;
  color: var(--text);
}
#hud-temp { color: #e05020; }
#hud-wind { color: var(--wind-col); }
#hud-apparent { color: #e05020; opacity: 0.75; font-size: 28px; }

/* ============================================================
   ABC CARD
   ============================================================ */
#abc-card {
  margin: 8px 12px 4px;
  border-radius: var(--radius);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border: 2px solid transparent;
  transition: background 0.3s, border-color 0.3s;
}
#abc-card.grade-A { background: #e8f7ef; border-color: var(--a-col); }
#abc-card.grade-B { background: #fef5e4; border-color: var(--b-col); }
#abc-card.grade-C { background: #fde8e8; border-color: var(--c-col); }

#abc-grade {
  font-family: var(--font-display);
  font-size: 56px;
  line-height: 1;
  width: 56px;
  text-align: center;
}
.grade-A #abc-grade { color: var(--a-col); }
.grade-B #abc-grade { color: var(--b-col); }
.grade-C #abc-grade { color: var(--c-col); }

#abc-reason {
  flex: 1;
  padding-left: 12px;
}
#abc-reason-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: 1px;
}
#abc-reason-text {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-top: 2px;
  line-height: 1.4;
  /* 高さを2行分に固定し、スクロール中の文言変化でチャートが縦に動くのを防ぐ */
  height: 2.8em;
  overflow: hidden;
  display: flex;
  align-items: center;
}
#abc-sub {
  font-size: 11px;
  color: var(--text2);
  margin-top: 3px;
}

/* ============================================================
   CHARTS AREA
   ============================================================ */
/* チャート領域の外枠。スクラブライン・パーティクルはこの中に
   absoluteで固定し、スクロールに一切参加させない
   （iOS Safariのsticky追従バグによる「飛び」を構造的に排除） */
#charts-outer {
  flex: 1;
  min-height: 0;
  position: relative;
  background: #f9f8f5;
}
#charts-wrapper {
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  /* スクロールバー非表示 */
  scrollbar-width: none;
  -ms-overflow-style: none;
}
#charts-wrapper::-webkit-scrollbar { display: none; }
#charts-inner {
  position: relative;
  width: max-content;   /* チャート実幅に合わせてラッパーを横スクロールさせる */
}
/* 現在位置スクラブライン（画面左1/3に完全固定。チャート側が下を流れ、
   日を跨いでもシームレス。スクロールコンテナ外なので絶対に動かない） */
#scrub-line {
  position: absolute;
  left: 33%;
  top: 0;
  width: 0;
  height: 0;
  overflow: visible;
  z-index: 6;
  pointer-events: none;
}
#scrub-bar {
  position: absolute;
  left: -1px;           /* 線幅2pxの中心合わせ */
  top: 0;
  width: 2px;
  background: #e03010;
}
#time-badge {
  position: absolute;
  top: 1px;
  left: 0;
  transform: translateX(-50%);
  background: #e03010;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  white-space: nowrap;
}
/* 「現在へ戻る」ボタン（現在時刻がカーソルから離れているときのみ表示） */
#btn-now {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 7;
  min-height: 44px;   /* グローブ操作前提のタップ領域 */
  padding: 0 16px;
  border: none;
  border-radius: 22px;
  background: var(--text);
  color: #fff;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: none;
}

/* ============================================================
   TIME SLIDER
   ============================================================ */
#slider-row {
  padding: 4px 14px 4px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
}
#time-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: var(--bg2);
  outline: none;
  cursor: pointer;
}
#time-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--text);
  cursor: pointer;
}
#slider-labels {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--text3);
  font-family: var(--font-mono);
  padding: 2px 0;
}

/* ============================================================
   FOOTER
   ============================================================ */
#footer {
  display: flex;
  gap: 8px;
  padding: 8px 12px;
  border-top: 2px solid var(--border);
  flex-shrink: 0;
}
.foot-btn {
  flex: 1;
  padding: 10px 0;
  border: 2px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-ui);
  color: var(--text);
  transition: background 0.15s, border-color 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.foot-btn:active { background: var(--bg2); }
.foot-btn .icon { font-size: 18px; }
#btn-gps { border-color: var(--a-col); color: var(--a-col); }
#btn-map { border-color: var(--b-col); color: var(--b-col); }
#btn-fav { border-color: var(--text3); }

/* ============================================================
   MAP OVERLAY
   ============================================================ */
#map-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: none;
  flex-direction: column;
  background: var(--surface);
}
#map-overlay.open { display: flex; }
#map-header {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 2px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
}
#map-header h2 { flex: 1; font-size: 16px; }
#btn-map-close {
  font-size: 22px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--text);
  padding: 4px 8px;
}
#map { flex: 1; }
#map-hint {
  padding: 8px 14px;
  font-size: 11px;
  color: var(--text2);
  text-align: center;
  flex-shrink: 0;
}

/* ============================================================
   FAVORITES OVERLAY
   ============================================================ */
#fav-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  background: var(--surface);
  display: none;
  flex-direction: column;
}
#fav-overlay.open { display: flex; }
#fav-header {
  display: flex; align-items: center;
  padding: 12px 14px;
  border-bottom: 2px solid var(--border);
  gap: 10px;
}
#fav-header h2 { flex: 1; font-size: 16px; }
#btn-fav-close {
  font-size: 22px; border: none; background: none; cursor: pointer; color: var(--text);
  padding: 4px 8px;
}
#fav-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fav-item {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  gap: 10px;
  transition: background 0.15s;
}
.fav-item:active { background: var(--bg2); }
.fav-item-name { flex: 1; font-weight: 700; font-size: 14px; }
.fav-item-coord { font-size: 10px; font-family: var(--font-mono); color: var(--text3); }
.fav-delete {
  font-size: 18px; padding: 4px 6px;
  background: none; border: none; cursor: pointer; color: var(--c-col);
}
#fav-save-btn {
  margin: 0 12px 12px;
  padding: 13px;
  background: var(--text);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-ui);
}

/* ============================================================
   RANKING OVERLAY
   ============================================================ */
#rank-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  background: var(--surface);
  display: none;
  flex-direction: column;
}
#rank-overlay.open { display: flex; }
#rank-header {
  display: flex; align-items: center;
  padding: 12px 14px;
  border-bottom: 2px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
}
#rank-header h2 { flex: 1; font-size: 16px; }
#btn-rank-close {
  font-size: 22px; border: none; background: none; cursor: pointer; color: var(--text);
  padding: 4px 8px;
}
#rank-date-row {
  display: flex;
  gap: 8px;
  padding: 10px 12px 6px;
  flex-shrink: 0;
}
.rank-date-btn {
  flex: 1;
  min-height: 44px;   /* グローブ操作前提のタップ領域 */
  border: 2px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-ui);
  color: var(--text2);
}
.rank-date-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
#rank-date-input {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-size: 12px;
  padding: 0 8px;
  color: var(--text2);
  background: var(--surface);
}
#rank-note {
  padding: 2px 14px 6px;
  font-size: 10px;
  color: var(--text3);
  flex-shrink: 0;
  line-height: 1.5;
}
#rank-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rank-msg { color: var(--text3); text-align: center; margin-top: 24px; font-size: 13px; }
.rank-card {
  border: 2px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  flex-shrink: 0;
}
.rank-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  min-height: 48px;   /* タップ領域44px以上 */
  cursor: pointer;
}
.rank-card-head:active { background: var(--bg2); }
.rank-pos {
  font-family: var(--font-display);
  font-size: 20px;
  width: 26px;
  text-align: center;
  color: var(--text3);
}
.rank-name { flex: 1; min-width: 0; }
.rank-name .rn-main { font-weight: 700; font-size: 14px; }
.rank-name .rn-sub { font-size: 10px; color: var(--text3); }
.rank-badges { display: flex; gap: 4px; align-items: center; }
.rank-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 34px;
  padding: 3px 4px;
  border-radius: 8px;
  font-weight: 700;
  line-height: 1.1;
}
.rank-badge .rb-day { font-size: 9px; }
.rank-badge .rb-grade { font-family: var(--font-display); font-size: 18px; }
.rb-A { background: #e8f7ef; color: var(--a-col); }
.rb-B { background: #fef5e4; color: var(--b-col); }
.rb-C { background: #fde8e8; color: var(--c-col); }
.rb-X { background: var(--bg2); color: var(--text3); }
.rank-avg { font-size: 10px; color: var(--text3); margin-left: 2px; white-space: nowrap; }
.rank-detail {
  display: none;
  border-top: 1px solid var(--border);
  padding: 8px 10px 10px;
  background: var(--bg);
}
.rank-card.open .rank-detail { display: block; }
.rank-detail table { width: 100%; border-collapse: collapse; font-size: 11px; }
.rank-detail th {
  font-size: 9px; color: var(--text3);
  text-align: left; padding: 3px 4px; font-weight: 700;
}
.rank-detail td { padding: 4px; border-top: 1px solid var(--border); vertical-align: middle; }
.peak-link {
  background: none; border: none;
  padding: 6px 2px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 12px;
  color: var(--text);
  text-align: left;
  text-decoration: underline;
}
.peak-elev { font-size: 9px; color: var(--text3); }
.pd-grade {
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
  display: inline-block;
}
.pd-metrics { font-size: 10px; color: var(--text2); font-family: var(--font-mono); margin-top: 2px; }

/* ============================================================
   LOADING / ERROR
   ============================================================ */
#loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(245,244,240,0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
  gap: 16px;
}
.spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--border);
  border-top-color: var(--text);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-text {
  font-size: 13px; color: var(--text2); font-weight: 700;
}

/* ============================================================
   PARTICLES CANVAS
   ============================================================ */
#particle-canvas {
  position: absolute;   /* charts-outerに固定（スクロール非参加） */
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 5;
}
/* 固定Y軸ガター（画面左端。スクロールしても目盛りが消えない） */
#axis-canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 6;
}

/* ============================================================
   LEGEND
   ============================================================ */
#legend {
  display: flex;
  gap: 10px;
  padding: 3px 14px 3px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9px;
  color: var(--text2);
  font-weight: 700;
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div id="app">

  <!-- Loading -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">気象データ取得中…</div>
  </div>

  <!-- Header -->
  <div id="header">
    <span id="app-logo">SotoKi</span>
    <span id="app-version">v4.5.0</span>
    <span id="location-name">──</span>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="day" onclick="setMode('day')">日帰</button>
      <button class="mode-btn" data-mode="camp" onclick="setMode('camp')">幕営</button>
    </div>
  </div>

  <!-- Day selector -->
  <div id="day-selector">
    <button class="day-tab" data-offset="-1" onclick="jumpToDay(-1)">昨日</button>
    <button class="day-tab active" data-offset="0" onclick="jumpToDay(0)">今日</button>
    <button class="day-tab" data-offset="1" onclick="jumpToDay(1)">明日</button>
    <button class="day-tab" data-offset="2" onclick="jumpToDay(2)">明後日</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-item">
      <span id="hud-time" class="hud-time">--:--</span>
      <span class="hud-label">JST</span>
    </div>
    <div class="hud-item">
      <span id="hud-temp" class="hud-val">--</span>
      <span class="hud-label">気温 °C</span>
    </div>
    <div class="hud-item">
      <span id="hud-apparent" class="hud-val">--</span>
      <span class="hud-label">体感 °C</span>
    </div>
    <div class="hud-item">
      <span id="hud-wind" class="hud-val">--</span>
      <span class="hud-label">風速 m/s</span>
    </div>
  </div>

  <!-- ABC Card -->
  <div id="abc-card" class="grade-A">
    <span id="abc-grade">A</span>
    <div id="abc-reason">
      <div id="abc-reason-title">総合判定</div>
      <div id="abc-reason-text">データ取得中</div>
      <div id="abc-sub">──</div>
    </div>
  </div>

  <!-- Legend -->
  <div id="legend">

    </button>

      <input type="date" id="rank-date-input" onchange="setRankDate('custom')">

      6〜18時の最悪値で判定（<span id="rank-mode-label">日帰り</span>モード） /
      山域＝代表峰の最良値、括弧は平均 / 風:最大m/s 雨:合計mm 雪:合計cm 温:最低℃
    </div>

</div><!-- #app -->

<script>
/* ============================================================
   STATE
   ============================================================ */
const state = {
  lat: 36.57,
  lon: 137.65,
  locationName: '立山・黒部',
  mode: 'day',
  allData: null,
  sliderIndex: 24,   // デフォルト：今日0時（index 24 = past_days=1の翌日）
  dayOffset: 0,
};

// ABC閾値
const THRESH = {
  day:  { windA:5,  windB:10 },
  camp: { windA:3,  windB:8  },
  apparentA: -3, apparentB: -15,
  snowA: 0.5, snowB: 2,
  rainA: 1,   rainB: 3,
  dpressA: 6, dpressB: 10,
};

/* ============================================================
   MODE
   ============================================================ */
function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  if (!state.allData) return;
  updateABC();
  if (windChart) windChart.redraw();   // 風速バーの閾値色のみ更新
}

/* ============================================================
   DATA FETCH
   ============================================================ */
async function fetchWeather(lat, lon) {
  showLoading('気象データ取得中…');
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,apparent_temperature,precipitation,snowfall,surface_pressure,windspeed_10m,weathercode,cloudcover&timezone=Asia%2FTokyo&past_days=1&forecast_days=3&models=jma_seamless`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    state.allData = processData(json);
    state.lat = lat;
    state.lon = lon;
    // 初期表示位置は現在時刻（データ範囲外なら今日0時のまま）
    const nf = nowIndexFrac();
    if (nf != null) {
      state.sliderIndex = Math.max(0, Math.min(state.allData.length - 1, Math.round(nf)));
      state.dayOffset = Math.floor(state.sliderIndex / 24) - 1;
    }
    saveLast(lat, lon, state.locationName);
    // DOM反映後に描画
    requestAnimationFrame(() => {
      requestAnimationFrame(() => render());
    });
  } catch (e) {
    hideLoading();
    alert('データ取得失敗: ' + e.message);
  }
}

function processData(json) {
  const h = json.hourly;
  const len = h.time.length; // 96h
  const data = [];
  for (let i = 0; i < len; i++) {
    const dt = new Date(h.time[i]);
    const pres6 = i >= 6 ? (h.surface_pressure[i] - h.surface_pressure[i-6]) : 0;
    data.push({
      time: dt,
      temp: h.temperature_2m[i],
      apparent: h.apparent_temperature[i],
      precip: h.precipitation[i],
      snow: h.snowfall[i],
      pressure: h.surface_pressure[i],
      wind: h.windspeed_10m[i],
      wcode: h.weathercode[i],
      cloud: h.cloudcover[i],
      dpress: pres6,
    });
  }
  return data;
}

/* ============================================================
   GPS
   ============================================================ */
function fetchGPS() {
  if (!navigator.geolocation) { alert('Geolocation非対応'); return; }
  showLoading('GPS取得中…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      state.locationName = `${state.lat.toFixed(3)}, ${state.lon.toFixed(3)}`;
      reverseGeocode(state.lat, state.lon).then(name => {
        state.locationName = name;
        fetchWeather(state.lat, state.lon);
      });
    },
    () => { hideLoading(); alert('GPS取得失敗'); },
    { timeout: 8000, enableHighAccuracy: true }
  );
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ja`);
    const j = await res.json();
    const a = j.address || {};
    return a.city || a.town || a.village || a.county || `${lat.toFixed(3)},${lon.toFixed(3)}`;
  } catch { return `${lat.toFixed(3)},${lon.toFixed(3)}`; }
}

/* ============================================================
   RENDER MASTER
   ============================================================ */
function render() {
  if (!state.allData) return;
  try {
    // sliderを現在のindexと同期
    slider.value = state.sliderIndex;
    updateLocationName();
    updateHUD();
    updateABC();
    buildCharts();          // データ取得時のみの1回描画
    updateScrubBadge();
    updateNowButton();
    scrollToIndex(state.sliderIndex);
    updateSliderLabels();
    updateDayTabs();
    updateParticles();
    hideLoading();
  } catch (e) {
    // 例外時にローディングが永久表示にならないよう必ず解除し、原因を表示
    hideLoading();
    alert('画面描画エラー: ' + e.message);
  }
}

function updateLocationName() {
  document.getElementById('location-name').textContent = state.locationName;
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const d = state.allData[state.sliderIndex];
  if (!d) return;
  const hh = d.time.getHours().toString().padStart(2,'0');
  const mm = d.time.getMinutes().toString().padStart(2,'0');
  document.getElementById('hud-time').textContent = `${hh}:${mm}`;
  document.getElementById('hud-temp').textContent = d.temp != null ? Math.round(d.temp) : '--';
  document.getElementById('hud-apparent').textContent = d.apparent != null ? Math.round(d.apparent) : '--';
  document.getElementById('hud-wind').textContent = d.wind != null ? Math.round(d.wind) : '--';
}

/* ============================================================
   ABC JUDGMENT
   ============================================================ */
function abcScore(val, a, b) {
  if (val == null) return 0;
  if (val < a) return 0;
  if (val < b) return 1;
  return 2;
}
function abcScoreInv(val, a, b) { // 低いほど悪い
  if (val == null) return 0;
  if (val > a) return 0;
  if (val > b) return 1;
  return 2;
}

function judgePoint(d) {
  const t = THRESH;
  const modeT = THRESH[state.mode];
  const scores = [];
  const reasons = [];

  const ws = abcScore(d.wind, modeT.windA, modeT.windB);
  scores.push(ws);
  if (ws === 2) reasons.push('風速が危険値');
  else if (ws === 1) reasons.push('風が強め');

  const as = abcScoreInv(d.apparent, t.apparentA, t.apparentB);
  scores.push(as);
  if (as === 2) reasons.push('体感気温が危険値');
  else if (as === 1) reasons.push('体感寒冷');

  if (d.snow > 0) {
    const ss = abcScore(d.snow, t.snowA, t.snowB);
    scores.push(ss);
    if (ss === 2) reasons.push('降雪が危険値');
    else if (ss === 1) reasons.push('降雪あり');
  }

  if (d.precip > 0) {
    const rs = abcScore(d.precip, t.rainA, t.rainB);
    scores.push(rs);
    if (rs === 2) reasons.push('降水が危険値');
  }

  const dp = Math.abs(d.dpress || 0);
  const ps = abcScore(dp, t.dpressA, t.dpressB);
  scores.push(ps);
  if (ps === 2) reasons.push('気圧変化が急激');
  else if (ps === 1) reasons.push('気圧低下中');

  const worst = Math.max(...scores, 0);
  const grade = ['A','B','C'][worst];
  return { grade, reasons };
}

function updateABC() {
  const d = state.allData[state.sliderIndex];
  if (!d) return;
  const { grade, reasons } = judgePoint(d);
  const card = document.getElementById('abc-card');
  card.className = `grade-${grade}`;
  document.getElementById('abc-grade').textContent = grade;
  const t = THRESH[state.mode];
  document.getElementById('abc-reason-title').textContent = `総合判定（${state.mode === 'day' ? '日帰り' : '幕営'}）`;
  document.getElementById('abc-reason-text').textContent =
    reasons.length ? reasons.join('・') :
    grade === 'A' ? '問題なし' : '注意が必要';

  const dp = Math.abs(d.dpress || 0);
  document.getElementById('abc-sub').textContent =
    `風${(d.wind||0).toFixed(1)}m/s 体感${(d.apparent||0).toFixed(0)}℃ ΔP${dp.toFixed(1)}hPa/6h`;
}

/* ============================================================
   CHARTS (uPlot)  ── データ取得時に1回だけ描画。
   スクロールはCSSネイティブ、現在位置インジケーターはDOM
   オーバーレイのtransform更新のみ（canvas再描画なし）
   ============================================================ */
const CHART_H_SKY   = 140;
const CHART_H_PREC  = 90;
const CHART_H_WIND  = 90;
const PADDING_L     = 38;
const PADDING_R     = 8;
const PX_PER_HOUR   = 18;   // 1時間あたりのpx幅（96h × 18 = 1728px）
const HOURS         = 96;
const PX_RATIO      = Math.min(window.devicePixelRatio || 1, 2); // 過剰解像度の禁止

let skyChart = null, precipChart = null, windChart = null;

// 全体の論理幅（CSS px）
function chartTotalW() { return PADDING_L + HOURS * PX_PER_HOUR + PADDING_R; }

// sliderIndexに対応するx座標（バーの中心、CSS px）
function idxToX(idx) { return PADDING_L + (idx + 0.5) * PX_PER_HOUR; }

// 実際のcanvas倍率（pxRatio未対応環境でもcanvas実寸から算出）
function canvasRatio(u) { return u.ctx.canvas.width / u.width; }

// スクラブライン（画面左1/3固定）に全時刻が到達できるよう、
// チャート両端に余白を設ける。戻り値はモジュール変数chartPadLに保持
let chartPadL = 0;
function updateChartSpacers() {
  const wrap = document.getElementById('charts-wrapper');
  const vw = wrap.clientWidth || window.innerWidth;
  chartPadL = Math.max(0, Math.round(vw * 0.33 - idxToX(0)));
  const padR = Math.max(0, Math.round(vw * 0.67 - (chartTotalW() - idxToX(HOURS - 1))));
  const inner = document.getElementById('charts-inner');
  inner.style.paddingLeft = chartPadL + 'px';
  inner.style.paddingRight = padR + 'px';
  // box-sizing: border-boxのためpadding込みの幅を指定
  // （uPlotのサイズ適用は次フレーム遅延のため、スクロール可能幅を先に確定させる）
  inner.style.width = (chartTotalW() + chartPadL + padR) + 'px';
}

function buildCharts() {
  if (typeof uPlot === 'undefined') {
    throw new Error('チャートライブラリ(uPlot)の読み込みに失敗しました。通信環境を確認して再読み込みしてください');
  }
  const data = state.allData;
  updateChartSpacers();
  const xs       = data.map((_, i) => i);
  const temps    = data.map(d => d.temp);
  const precips  = data.map(d => d.precip);
  const snows    = data.map(d => d.snow);
  const winds    = data.map(d => d.wind);
  const pressures = data.map(d => d.pressure);

  if (skyChart)    { skyChart.destroy();    skyChart = null; }
  if (precipChart) { precipChart.destroy(); precipChart = null; }
  if (windChart)   { windChart.destroy();   windChart = null; }

  const common = {
    width: chartTotalW(),
    pxRatio: PX_RATIO,
    cursor: { show: false },
    legend: { show: false },
  };
  const xScale = { time: false, range: [-0.5, HOURS - 0.5] };

  // --- SKY（空色背景 + 気温ライン） ---
  skyChart = new uPlot({
    ...common,
    height: CHART_H_SKY,
    padding: [30, PADDING_R, 16, PADDING_L],
    scales: {
      x: xScale,
      y: { range: (u, min, max) => [min - 3, max + 3] },
    },
    axes: [{ show: false }, { show: false }],
    series: [
      {},
      {
        stroke: '#e05020',
        width: 2.5,
        spanGaps: true,
        points: { show: false },
        fill: u => {
          const g = u.ctx.createLinearGradient(0, 0, 0, u.ctx.canvas.height);
          g.addColorStop(0, 'rgba(224,80,32,0.4)');
          g.addColorStop(1, 'rgba(224,80,32,0)');
          return g;
        },
      },
    ],
    hooks: {
      drawClear: [drawSkyBackground],
      draw: [drawSkyOverlay, drawNowMarker],
    },
  }, [xs, temps], document.getElementById('chart-sky'));

  // --- PRECIP（降水・降雪バー、バー本体はhook描画） ---
  precipChart = new uPlot({
    ...common,
    height: CHART_H_PREC,
    padding: [10, PADDING_R, 0, PADDING_L],
    scales: {
      x: xScale,
      y: { range: (u, min, max) => [0, Math.max(5, max)] },
    },
    axes: [{ show: false }, { show: false }],
    series: [
      {},
      { paths: () => null, points: { show: false } },  // 降水（スケール算出用）
      { paths: () => null, points: { show: false } },  // 降雪（スケール算出用）
    ],
    hooks: {
      drawClear: [drawPanelBackground],
      draw: [drawPrecipBars, drawNowMarker],
    },
  }, [xs, precips, snows], document.getElementById('chart-precip'));

  // --- WIND + PRESSURE（風速バーはhook描画、気圧はライン） ---
  windChart = new uPlot({
    ...common,
    height: CHART_H_WIND,
    padding: [10, PADDING_R, 0, PADDING_L],
    scales: {
      x: xScale,
      w: { range: (u, min, max) => [0, Math.max(20, max)] },
      p: { range: (u, min, max) => [min - 3, max + 3] },
    },
    axes: [{ show: false }, { show: false, scale: 'w' }],
    series: [
      {},
      { scale: 'w', paths: () => null, points: { show: false } },        // 風速（スケール算出用）
      { scale: 'p', stroke: '#aaa', width: 1.5, spanGaps: true, points: { show: false } },  // 気圧
    ],
    hooks: {
      drawClear: [drawPanelBackground],
      draw: [drawWindBars, drawNowMarker],
    },
  }, [xs, winds, pressures], document.getElementById('chart-wind'));

  // スクラブラインの高さをチャート合計に合わせる
  document.getElementById('scrub-bar').style.height =
    (CHART_H_SKY + CHART_H_PREC + CHART_H_WIND) + 'px';

  // 固定Y軸ガター用のスケール情報（uPlotのrange関数と同一の計算）
  const validTemps = temps.filter(v => v != null);
  scaleInfo = {
    tempMin: Math.min(...validTemps) - 3,
    tempMax: Math.max(...validTemps) + 3,
    precipMax: Math.max(5, ...precips.map(v => v || 0), ...snows.map(v => v || 0)),
    windMax: Math.max(20, ...winds.map(v => v || 0)),
  };
  drawAxisGutter();
}

/* ------ 固定Y軸ガター（画面左端に固定。スクロールで目盛りが消えない） ------ */
let scaleInfo = null;

function drawAxisGutter() {
  const c = document.getElementById('axis-canvas');
  const W = PADDING_L + 2;
  const H = CHART_H_SKY + CHART_H_PREC + CHART_H_WIND;
  c.width = Math.round(W * PX_RATIO);
  c.height = Math.round(H * PX_RATIO);
  c.style.width = W + 'px';
  c.style.height = H + 'px';
  const ctx = c.getContext('2d');
  ctx.setTransform(PX_RATIO, 0, 0, PX_RATIO, 0, 0);

  // 半透明の下地 + 右境界線
  ctx.fillStyle = 'rgba(249,248,245,0.88)';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(0,0,0,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W - 0.5, 0); ctx.lineTo(W - 0.5, H); ctx.stroke();
  if (!scaleInfo) return;
  const si = scaleInfo;

  // --- 気温（skyチャート、padding[30,,16]と同一ジオメトリ） ---
  const skyTop = 30;
  const skyBottom = CHART_H_SKY - 16;
  const ty = t => skyTop + (si.tempMax - t) / (si.tempMax - si.tempMin) * (skyBottom - skyTop);
  ctx.textAlign = 'left';
  ctx.font = "bold 8px 'Noto Sans JP', sans-serif";
  ctx.fillStyle = '#e05020';
  ctx.fillText('気温℃', 3, 10);
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  [si.tempMin + 2, (si.tempMin + si.tempMax) / 2, si.tempMax - 2].forEach(t => {
    ctx.fillText(Math.round(t) + '°', W - 4, ty(t) + 3);
  });

  // --- 降水・降雪 ---
  const pTop = CHART_H_SKY;
  ctx.textAlign = 'left';
  ctx.font = "bold 8px 'Noto Sans JP', sans-serif";
  ctx.fillStyle = '#3a7fc1';
  ctx.fillText('降水㎜', 3, pTop + 10);
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(si.precipMax.toFixed(0), W - 4, pTop + 22);
  ctx.fillStyle = 'rgba(58,127,193,0.6)';
  ctx.fillText('0', W - 4, pTop + CHART_H_PREC - 3);

  // --- 風・気圧 ---
  const wTop = CHART_H_SKY + CHART_H_PREC;
  ctx.textAlign = 'left';
  ctx.font = "bold 8px 'Noto Sans JP', sans-serif";
  ctx.fillStyle = '#6c5ce7';
  ctx.fillText('風m/s', 3, wTop + 10);
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(String(Math.round(si.windMax)), W - 4, wTop + 22);
  ctx.fillStyle = 'rgba(108,92,231,0.6)';
  ctx.fillText('0', W - 4, wTop + CHART_H_WIND - 3);
}

/* ------ SKY hook: 空色背景 + 日付区切り ------ */
function drawSkyBackground(u) {
  const ctx = u.ctx;
  const pr = canvasRatio(u);
  const data = state.allData;
  const H = ctx.canvas.height;
  const skyBottom = H - 16 * pr;   // 下部の時刻ラベル帯を除く
  ctx.save();
  // 空色（時間帯 × 雲量）
  for (let i = 0; i < data.length; i++) {
    const x0 = u.valToPos(i - 0.5, 'x', true);
    const x1 = u.valToPos(i + 0.5, 'x', true);
    ctx.fillStyle = getSkyColor(data[i].time.getHours(), data[i].cloud, data[i].wcode);
    ctx.fillRect(x0, 0, x1 - x0 + 1, skyBottom);
  }
  // 日付区切りライン + 日付ラベル
  ctx.font = `bold ${10 * pr}px 'Noto Sans JP', sans-serif`;
  ctx.textAlign = 'left';
  for (let i = 0; i < data.length; i++) {
    const t = data[i].time;
    if (t.getHours() !== 0) continue;
    const x = u.valToPos(i - 0.5, 'x', true);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = pr;
    ctx.setLineDash([4 * pr, 3 * pr]);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, skyBottom); ctx.stroke();
    ctx.setLineDash([]);
    const dow = ['日','月','火','水','木','金','土'][t.getDay()];
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(`${t.getMonth() + 1}/${t.getDate()}(${dow})`, x + 3 * pr, 12 * pr);
  }
  ctx.restore();
}

/* ------ SKY hook: 天気アイコン + 時刻/気温ラベル ------ */
function drawSkyOverlay(u) {
  const ctx = u.ctx;
  const pr = canvasRatio(u);
  const data = state.allData;
  const H = ctx.canvas.height;
  ctx.save();
  ctx.textAlign = 'center';
  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    if (d.time.getHours() % 6 !== 0) continue;
    const x = u.valToPos(i, 'x', true);
    ctx.font = `${14 * pr}px sans-serif`;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(weatherEmoji(d.wcode), x, 26 * pr);
    ctx.font = `bold ${9 * pr}px monospace`;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(d.time.getHours() + 'h', x, H - 4 * pr);
  }
  // Y軸ラベルは固定ガター（drawAxisGutter）で表示
  ctx.restore();
}

/* ------ PRECIP/WIND共通 hook: 背景 + グリッド + 日付区切り ------ */
function drawPanelBackground(u) {
  const ctx = u.ctx;
  const pr = canvasRatio(u);
  const W = ctx.canvas.width;
  const H = ctx.canvas.height;
  ctx.save();
  ctx.fillStyle = '#f9f8f5';
  ctx.fillRect(0, 0, W, H);
  // グリッド
  ctx.strokeStyle = '#e0ddd5';
  ctx.lineWidth = 0.5 * pr;
  [0.33, 0.66, 1.0].forEach(r => {
    const y = H * (1 - r) * 0.9 + 4 * pr;
    ctx.beginPath();
    ctx.moveTo(PADDING_L * pr, y);
    ctx.lineTo(W - PADDING_R * pr, y);
    ctx.stroke();
  });
  // 日付区切り
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = pr;
  const data = state.allData;
  for (let i = 0; i < data.length; i++) {
    if (data[i].time.getHours() !== 0) continue;
    const x = u.valToPos(i - 0.5, 'x', true);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.restore();
}

/* ------ PRECIP hook: 降水・降雪バー ------ */
function drawPrecipBars(u) {
  const ctx = u.ctx;
  const pr = canvasRatio(u);
  const data = state.allData;
  const bottom = u.bbox.top + u.bbox.height;
  ctx.save();
  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    if (!(d.precip > 0) && !(d.snow > 0)) continue;
    const x0 = u.valToPos(i - 0.5, 'x', true) + pr;
    const x1 = u.valToPos(i + 0.5, 'x', true) - pr;
    const barW = x1 - x0;
    if (d.precip > 0) {
      const y = u.valToPos(d.precip, 'y', true);
      ctx.fillStyle = '#3a7fc1';
      ctx.fillRect(x0, y, barW, bottom - y);
    }
    if (d.snow > 0) {
      const y = u.valToPos(d.snow, 'y', true);
      ctx.fillStyle = '#7bb8e8';
      ctx.globalAlpha = 0.85;
      ctx.fillRect(x0, y, barW * 0.6, bottom - y);
      ctx.globalAlpha = 1;
    }
  }
  // Y軸ラベルは固定ガター（drawAxisGutter）で表示
  ctx.restore();
}

/* ------ WIND hook: 風速バー（閾値色分け、気圧ラインの上に重ねる） ------ */
function drawWindBars(u) {
  const ctx = u.ctx;
  const pr = canvasRatio(u);
  const data = state.allData;
  const modeT = THRESH[state.mode];
  const bottom = u.bbox.top + u.bbox.height;
  ctx.save();
  ctx.globalAlpha = 0.72;
  for (let i = 0; i < data.length; i++) {
    const w = data[i].wind || 0;
    const x0 = u.valToPos(i - 0.5, 'x', true) + pr;
    const x1 = u.valToPos(i + 0.5, 'x', true) - pr;
    const y = u.valToPos(w, 'w', true);
    let col = '#6c5ce7';
    if (w >= modeT.windB) col = '#d03030';
    else if (w >= modeT.windA) col = '#e8a020';
    ctx.fillStyle = col;
    ctx.fillRect(x0, y, x1 - x0, bottom - y);
  }
  ctx.globalAlpha = 1;
  // Y軸ラベルは固定ガター（drawAxisGutter）で表示
  ctx.restore();
}

/* ------ 現在時刻 ------ */
// データ先頭からの経過時間（時、小数）。データ範囲外ならnull
function nowIndexFrac() {
  if (!state.allData || !state.allData.length) return null;
  const frac = (Date.now() - state.allData[0].time.getTime()) / 3600e3;
  if (frac < 0 || frac > state.allData.length - 1) return null;
  return frac;
}

// 過去域の薄いグレーアウト + 現在時刻の実線マーカー（uPlot draw hook）
function drawNowMarker(u) {
  const frac = nowIndexFrac();
  if (frac == null) return;
  const ctx = u.ctx;
  const pr = canvasRatio(u);
  const H = ctx.canvas.height;
  const x0 = u.valToPos(-0.5, 'x', true);
  const xNow = u.valToPos(frac, 'x', true);
  ctx.save();
  // 過去域をほんの少しグレーアウト
  ctx.fillStyle = 'rgba(110,110,110,0.16)';
  ctx.fillRect(x0, 0, xNow - x0, H);
  // 現在時刻線（実線・青）
  ctx.strokeStyle = '#2570c9';
  ctx.lineWidth = 2 * pr;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(xNow, 0);
  ctx.lineTo(xNow, H);
  ctx.stroke();
  // 「現在」ラベル（skyチャートのみ）
  if (u === skyChart) {
    const label = '現在';
    ctx.font = `bold ${9 * pr}px 'Noto Sans JP', sans-serif`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = '#2570c9';
    ctx.fillRect(xNow - tw / 2 - 3 * pr, 14 * pr, tw + 6 * pr, 13 * pr);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(label, xNow, 24 * pr);
  }
  ctx.restore();
}

/* ============================================================
   SKY COLOR HELPER
   ============================================================ */
function getSkyColor(hour, cloud, wcode) {
  const isNight = hour < 5 || hour >= 19;
  const isDawn  = (hour >= 5 && hour < 7) || (hour >= 17 && hour < 19);
  const cloudF  = (cloud || 0) / 100;

  if (isNight) {
    return `rgba(13,27,62,${0.7 + cloudF * 0.2})`;
  }
  if (isDawn) {
    const r = Math.round(249 * (1 - cloudF) + 150 * cloudF);
    const g = Math.round(168 * (1 - cloudF) + 150 * cloudF);
    const b = Math.round(117 * (1 - cloudF) + 160 * cloudF);
    return `rgb(${r},${g},${b})`;
  }
  // Daytime
  const r = Math.round(135 * (1 - cloudF) + 188 * cloudF);
  const g = Math.round(206 * (1 - cloudF) + 196 * cloudF);
  const b = Math.round(235 * (1 - cloudF) + 204 * cloudF);
  return `rgb(${r},${g},${b})`;
}

/* ============================================================
   WEATHER EMOJI
   ============================================================ */
function weatherEmoji(code) {
  if (code == null) return '？';
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 49) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  if (code <= 86) return '🌨️';
  if (code >= 95) return '⛈️';
  return '🌥️';
}

/* ============================================================
   PARTICLES (雨・雪エフェクト)
   ============================================================ */
let particles = [];
let particleAnim = null;

function updateParticles() {
  const d = state.allData[state.sliderIndex];
  const wrap = document.getElementById('charts-wrapper');
  const pc = document.getElementById('particle-canvas');
  pc.width = wrap.clientWidth;
  pc.height = wrap.clientHeight;

  if (!d) { cancelAnimationFrame(particleAnim); particles = []; return; }

  const isRain = d.precip > 1;
  const isSnow = d.snow > 0.5;
  const isHeavy = d.precip > 3 || d.snow > 2;

  if (!isRain && !isSnow) {
    cancelAnimationFrame(particleAnim);
    particles = [];
    pc.getContext('2d').clearRect(0, 0, pc.width, pc.height);
    return;
  }

  const count = isHeavy ? 60 : 25;
  if (particles.length !== count) {
    particles = Array.from({ length: count }, () => makeParticle(pc.width, pc.height, isSnow));
  }

  cancelAnimationFrame(particleAnim);
  function loop() {
    const ctx = pc.getContext('2d');
    ctx.clearRect(0, 0, pc.width, pc.height);
    particles.forEach(p => {
      p.y += p.vy;
      p.x += p.vx;
      if (p.y > pc.height) Object.assign(p, makeParticle(pc.width, pc.height, isSnow, true));
      if (isSnow) drawSnowflake(ctx, p);
      else drawRaindrop(ctx, p);
    });
    particleAnim = requestAnimationFrame(loop);
  }
  loop();
}

function makeParticle(W, H, isSnow, reset = false) {
  return {
    x: Math.random() * W,
    y: reset ? -10 : Math.random() * H,
    vx: isSnow ? (Math.random() - 0.5) * 0.8 : -0.5 + Math.random() * 0.3,
    vy: isSnow ? 0.8 + Math.random() * 1.2 : 4 + Math.random() * 3,
    size: isSnow ? 3 + Math.random() * 4 : 1 + Math.random() * 1.5,
    alpha: 0.35 + Math.random() * 0.35,
    isSnow,
  };
}
function drawRaindrop(ctx, p) {
  ctx.beginPath();
  ctx.strokeStyle = `rgba(58,127,193,${p.alpha})`;
  ctx.lineWidth = p.size;
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + p.vx * 2, p.y + p.vy * 2);
  ctx.stroke();
}
function drawSnowflake(ctx, p) {
  ctx.fillStyle = `rgba(200,230,255,${p.alpha})`;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
  ctx.fill();
}

// スクラブライン（画面左1/3固定）の下にある時刻へ同期。
// 軽量なDOM更新のみなのでrAFスロットルでスクロール中もリアルタイム追従し、

function syncFromScroll() {
  if (!state.allData) return;

  const rawIdx = Math.round((cx - PADDING_L) / PX_PER_HOUR - 0.5);

  slider.value = idx;
  updateDayTabs();
  updateHUD();
  updateABC();
  updateScrubBadge();
  updateNowButton();
}

    scrollRafPending = true;
    requestAnimationFrame(() => {
      scrollRafPending = false;
      syncFromScroll();

  // パーティクルは重めなのでスクロール停止後にのみ更新

/* ============================================================
   RANKING（全国山域ランキング）
   仕様: docs参照。ABC判定は既存judgePointをそのまま利用し、
   日単位評価は行動時間帯6〜18時の最悪値を採用。
   山域スコア = 代表峰の最良値（平均は参考表示）
   ============================================================ */
const RANK_WINDOW_START = 6;    // 評価時間帯の開始時（6時）
const RANK_WINDOW_END   = 18;   // 評価時間帯の終了時（18時、含む）
const RANK_MAX_AHEAD    = 6;    // カレンダー選択の上限（JMAモデルの予報期間内）

let areasData = null;           // areas.json（初回fetch後キャッシュ）
const rankFetchCache = {};      // 「日付レンジ+地点セット」→ 生の取得結果
let rankDates = [];             // 表示中の対象日（YYYY-MM-DD配列、週末は2要素）
let rankKind = 'weekend';

async function loadAreas() {
  if (areasData) return areasData;
  const res = await fetch('areas.json');
  if (!res.ok) throw new Error('areas.json HTTP ' + res.status);
  areasData = await res.json();
  return areasData;
}

// ローカル日付をYYYY-MM-DDに整形
function fmtDateISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// 種別 → 対象日配列。今週末=直近の土日（日曜当日は残りの日曜のみ）
function resolveRankDates(kind) {
  const today = new Date();
  if (kind === 'tomorrow') {
    const t = new Date(today);
    t.setDate(t.getDate() + 1);
    return [fmtDateISO(t)];
  }
  if (kind === 'custom') {
    const v = document.getElementById('rank-date-input').value;
    return v ? [v] : [];
  }
  // weekend
  const dow = today.getDay();   // 0=日
  if (dow === 0) return [fmtDateISO(today)];   // 日曜当日は今日のみ
  const sat = new Date(today);
  sat.setDate(sat.getDate() + (6 - dow));
  const sun = new Date(sat);
  sun.setDate(sun.getDate() + 1);
  return [fmtDateISO(sat), fmtDateISO(sun)];
}

// 全峰一括取得（1リクエスト、日付+地点セットでキャッシュ）
async function fetchRankData(dates) {
  const areas = await loadAreas();
  const peaks = areas.areas.flatMap(a => a.peaks);
  const key = `${dates.join('_')}_v${areas.version}_${peaks.length}`;
  if (rankFetchCache[key]) return rankFetchCache[key];

  const lats  = peaks.map(p => p.lat).join(',');
  const lons  = peaks.map(p => p.lon).join(',');
  const elevs = peaks.map(p => p.elev).join(',');
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&elevation=${elevs}` +
    `&hourly=temperature_2m,apparent_temperature,precipitation,snowfall,surface_pressure,windspeed_10m,weathercode,cloudcover` +
    `&timezone=Asia%2FTokyo&start_date=${dates[0]}&end_date=${dates[dates.length - 1]}&models=jma_seamless`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  let json = await res.json();
  if (!Array.isArray(json)) json = [json];   // 1地点時はオブジェクトで返る
  rankFetchCache[key] = json;
  return json;
}

// 1峰×1日の評価: 6〜18時をjudgePointで判定し最悪ランクと集計値を返す
function judgePeakDay(hourData, dateStr) {
  let worst = null, maxWind = 0, sumPrecip = 0, sumSnow = 0, minTemp = null;
  for (const d of hourData) {
    if (fmtDateISO(d.time) !== dateStr) continue;
    const h = d.time.getHours();
    if (h < RANK_WINDOW_START || h > RANK_WINDOW_END) continue;
    const { grade } = judgePoint(d);
    const r = { A: 0, B: 1, C: 2 }[grade];
    worst = worst == null ? r : Math.max(worst, r);
    maxWind = Math.max(maxWind, d.wind || 0);
    sumPrecip += d.precip || 0;
    sumSnow += d.snow || 0;
    if (d.temp != null) minTemp = minTemp == null ? d.temp : Math.min(minTemp, d.temp);
  }
  if (worst == null) return null;   // 対象時間帯のデータなし → 判定不能
  return { rank: worst, maxWind, sumPrecip, sumSnow, minTemp };
}

// ランキング構築: best昇順 → avg昇順 → 最高峰標高降順
async function buildRanking(dates) {
  const areas = (await loadAreas()).areas;
  const results = await fetchRankData(dates);
  let flatIdx = 0;
  const rows = areas.map(area => {
    const peakResults = area.peaks.map(peak => {
      const raw = results[flatIdx++];
      let days;
      try {
        const hourData = raw && raw.hourly ? processData(raw) : null;
        days = dates.map(ds => hourData ? judgePeakDay(hourData, ds) : null);
      } catch {
        days = dates.map(() => null);   // 失敗地点は判定不能でフォールバック
      }
      return { peak, days };
    });
    // 日別の山域スコア
    const dayScores = dates.map((_, di) => {
      const ranks = peakResults.map(pr => pr.days[di] && pr.days[di].rank).filter(v => v != null);
      if (!ranks.length) return null;
      return { best: Math.min(...ranks), avg: ranks.reduce((a, b) => a + b, 0) / ranks.length };
    });
    const bests = dayScores.filter(Boolean).map(s => s.best);
    const avgs  = dayScores.filter(Boolean).map(s => s.avg);
    return {
      area, peakResults, dayScores,
      best: bests.length ? Math.min(...bests) : 99,   // 判定不能山域は最後尾
      avg:  avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : 99,
      maxElev: Math.max(...area.peaks.map(p => p.elev)),
    };
  });
  rows.sort((a, b) => a.best - b.best || a.avg - b.avg || b.maxElev - a.maxElev);
  return rows;
}

const rankGradeChar = r => (r == null ? '—' : ['A', 'B', 'C'][r]);
const rankDowChar = ds => ['日', '月', '火', '水', '木', '金', '土'][new Date(ds + 'T00:00').getDay()];

function renderRankList(rows, dates) {
  const list = document.getElementById('rank-list');
  list.innerHTML = '';
  rows.forEach((row, i) => {
    const card = document.createElement('div');
    card.className = 'rank-card';

    const badges = row.dayScores.map((s, di) => {
      const g = s ? rankGradeChar(s.best) : '—';
      const cls = s ? `rb-${g}` : 'rb-X';
      const dayLabel = dates.length > 1 ? `<span class="rb-day">${rankDowChar(dates[di])}</span>` : '';
      return `<span class="rank-badge ${cls}">${dayLabel}<span class="rb-grade">${g}</span></span>`;
    }).join('');
    const avgTxt = row.avg < 90 ? `(平均${rankGradeChar(Math.round(row.avg))})` : '';

    const headCols = dates.map(ds =>
      `<th>${parseInt(ds.slice(5, 7))}/${parseInt(ds.slice(8, 10))}(${rankDowChar(ds)})</th>`).join('');
    const peakRows = row.peakResults.map(pr => {
      const cells = pr.days.map(d => {
        if (!d) return '<td><span class="pd-grade rb-X">—</span><div class="pd-metrics">判定不能</div></td>';
        const g = rankGradeChar(d.rank);
        const snowTxt = d.sumSnow > 0 ? ` 雪${d.sumSnow.toFixed(0)}` : '';
        const tempTxt = d.minTemp != null ? ` ${Math.round(d.minTemp)}°` : '';
        return `<td><span class="pd-grade rb-${g}">${g}</span>` +
          `<div class="pd-metrics">風${d.maxWind.toFixed(0)} 雨${d.sumPrecip.toFixed(0)}${snowTxt}${tempTxt}</div></td>`;
      }).join('');
      return `<tr><td><button class="peak-link" data-lat="${pr.peak.lat}" data-lon="${pr.peak.lon}" data-name="${pr.peak.name}">${pr.peak.name}</button>` +
        `<div class="peak-elev">${pr.peak.elev}m</div></td>${cells}</tr>`;
    }).join('');

    card.innerHTML = `
      <div class="rank-card-head">
        <span class="rank-pos">${i + 1}</span>
        <div class="rank-name">
          <div class="rn-main">${row.area.name}</div>
          <div class="rn-sub">${row.area.region}</div>
        </div>
        <div class="rank-badges">${badges}<span class="rank-avg">${avgTxt}</span></div>
      </div>
      <div class="rank-detail">
        <table>
          <tr><th>峰（タップで96h詳細）</th>${headCols}</tr>
          ${peakRows}
        </table>
      </div>
    `;
    card.querySelector('.rank-card-head').addEventListener('click', () => card.classList.toggle('open'));
    card.querySelectorAll('.peak-link').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        gotoPeak(btn.dataset.name, parseFloat(btn.dataset.lat), parseFloat(btn.dataset.lon));
      });
    });
    list.appendChild(card);
  });
}

// 峰名タップ → 既存96hメテオグラムへ遷移
function gotoPeak(name, lat, lon) {
  state.lat = lat;
  state.lon = lon;
  state.locationName = name;
  closeRank();
  fetchWeather(lat, lon);
}

async function refreshRanking() {
  const list = document.getElementById('rank-list');
  document.getElementById('rank-mode-label').textContent = state.mode === 'day' ? '日帰り' : '幕営';
  if (!rankDates.length) {
    list.innerHTML = '<div class="rank-msg">日付を選択してください</div>';
    return;
  }
  list.innerHTML = '<div class="rank-msg">全国の気象データ取得中…</div>';
  try {
    const rows = await buildRanking(rankDates);
    renderRankList(rows, rankDates);
  } catch (e) {
    list.innerHTML = `<div class="rank-msg">取得失敗: ${e.message}</div>`;
  }
}

function setRankDate(kind) {
  rankKind = kind;
  document.querySelectorAll('.rank-date-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.kind === kind));
  rankDates = resolveRankDates(kind);
  refreshRanking();
}

function openRank() {
  const input = document.getElementById('rank-date-input');
  const today = new Date();
  const max = new Date(today);
  max.setDate(max.getDate() + RANK_MAX_AHEAD);
  input.min = fmtDateISO(today);
  input.max = fmtDateISO(max);
  document.getElementById('rank-overlay').classList.add('open');
  rankDates = resolveRankDates(rankKind);
  refreshRanking();
}

function closeRank() {
  document.getElementById('rank-overlay').classList.remove('open');
}

/* ============================================================
   LOCALSTORAGE – 最終地点
   ============================================================ */
function saveLast(lat, lon, name) {
  localStorage.setItem('sotoki_last', JSON.stringify({ lat, lon, name }));
}
function loadLast() {
  try { return JSON.parse(localStorage.getItem('sotoki_last')); }
  catch { return null; }
}

/* ============================================================
   LOADING OVERLAY
   ============================================================ */
function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg || '読込中…';
  document.getElementById('loading-overlay').style.display = 'flex';
}
function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}

/* ============================================================
   RESIZE
   ============================================================ */
// チャートは固定幅のためリサイズ時の再描画は不要。
// 両端スペーサー再計算とスクロール位置の維持、パーティクルcanvasのみ追従
window.addEventListener('resize', () => {
  if (!state.allData) return;
  updateChartSpacers();
  scrollToIndex(state.sliderIndex);
  updateParticles();
});

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  hideLoading();
  const last = loadLast();
  if (last) {
    // 前回地点がある → そのままフェッチ（GPSはスキップ）
    state.lat = last.lat;
    state.lon = last.lon;
    state.locationName = last.name;
    fetchWeather(state.lat, state.lon);
    return;
  }
  // 前回地点なし → GPS試行 → 失敗時はデフォルト地点
  if (navigator.geolocation) {
    showLoading('GPS取得中…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        state.lat = pos.coords.latitude;
        state.lon = pos.coords.longitude;
        reverseGeocode(state.lat, state.lon).then(name => {
          state.locationName = name;
          fetchWeather(state.lat, state.lon);
        });
      },
      () => fetchWeather(state.lat, state.lon),
      { timeout: 5000, enableHighAccuracy: false }
    );
  } else {
    fetchWeather(state.lat, state.lon);
  }
})();
</script>
