<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS立体図・CI 試作</title>
<!-- 標高タイルをブラウザで読んで、CS立体図・CI（収束指数）をその場で計算して重ねる試作の閲覧ページ（新規）。
     ⚠ 見る用の層。THRESH・ABC評価・風の補正には使わない。本番（sotoki_v4.html など）には触らない。
     ⚠ 標高タイルも描いた画像も保存しない（メモリに保持するだけ）。 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.5 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; z-index: 1000; top: 8px; right: 8px; width: 300px; max-width: calc(100vw - 16px);
    max-height: calc(100% - 16px); overflow: auto; background: rgba(255,255,255,.94); border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.35); padding: 6px 10px; box-sizing: border-box; }
  #panel summary { font-weight: 600; cursor: pointer; padding: 4px 0; }
  .row { display: grid; grid-template-columns: 7.5em 1fr 4.2em; align-items: center; gap: 4px; margin: 2px 0; }
  .row.two { grid-template-columns: 7.5em 1fr; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  select, button { font: inherit; }
  #attr { font-size: 11px; color: #333; margin: 4px 0; }
  #stats { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; background: #f4f4f4; padding: 4px; border-radius: 4px; }
  .legend { display: flex; height: 10px; border-radius: 3px; margin: 2px 0; }
  .note { font-size: 11px; color: #555; }
  #apply { width: 100%; padding: 6px; margin: 4px 0; }
  #apply.dirty { background: #ffd54f; font-weight: 700; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel"><details open>
  <summary>CS立体図・CI 試作</summary>
  <div class="row two"><label for="src">標高タイル</label>
    <select id="src">
      <option value="gsi5">地理院 dem5a（0.01m・最大z15）</option>
      <option value="gsi10">地理院 dem（0.01m・最大z14）</option>
      <option value="tochigi">栃木県 terrainRGB（0.1m・最大z18）</option>
    </select></div>
  <div class="row two"><label for="layer">表示する層</label>
    <select id="layer">
      <option value="cs">CS立体図</option>
      <option value="ci">CI（＋尾根／−谷）</option>
      <option value="none">なし（地図のみ）</option>
    </select></div>
  <div class="row"><label for="maxz">最大ズーム</label><input id="maxz" type="range" min="12" max="18" step="1" value="18"><output id="maxz_o"></output></div>
  <div class="row"><label for="sigma">CS σ（m）</label><input id="sigma" type="range" min="1" max="30" step="0.5" value="5"><output id="sigma_o"></output></div>
  <div class="row"><label for="cscale">CS 曲率の強さ</label><input id="cscale" type="range" min="-3" max="-0.7" step="0.05" value="-2"><output id="cscale_o"></output></div>
  <div class="row"><label for="rad">CI 半径 R（m）</label><input id="rad" type="range" min="5" max="200" step="5" value="30"><output id="rad_o"></output></div>
  <div class="row"><label for="sigc">CI 下ならし（m）</label><input id="sigc" type="range" min="0" max="10" step="0.5" value="1.5"><output id="sigc_o"></output></div>
  <div class="row"><label for="ciscale">CI 満色（%）</label><input id="ciscale" type="range" min="5" max="80" step="5" value="20"><output id="ciscale_o"></output></div>
  <div class="row"><label for="op">不透明度</label><input id="op" type="range" min="0.1" max="1" step="0.05" value="0.65"><output id="op_o"></output></div>
  <div class="row two"><label for="miss">欠けの表示</label><label><input id="miss" type="checkbox"> 欠けを赤で示す</label></div>
  <button id="apply" type="button">適用</button>
  <div class="note" id="applyTime">適用：未実行</div>
  <div class="note">不透明度以外の変更は「適用」を押したときに計算する（押すまで前の設定のまま）。</div>
  <div class="legend" id="lg"></div>
  <div class="note" id="lgnote"></div>
  <div class="row two"><label>移動</label><span>
    <button data-v="36.7656,139.4937,15">男体山</button>
    <button data-v="36.2853,137.7328,15">常念岳</button>
    <button data-v="37.1236,139.9689,15">那須岳</button></span></div>
  <div id="attr"></div>
  <div class="row two"><label>計測</label><span><button id="reset">リセット</button> <button id="copy">JSONをコピー</button></span></div>
  <div class="note" id="copyMsg"></div>
  <div id="stats">計測中…</div>
  <div class="note">σ・R は m で指定し、タイルごとに升目の数へ直す。欠けは別の解像度で埋めない。標高タイルはメモリにだけ保持。</div>
</details></div>
<script>
"use strict";
// ---- 標高タイルの情報源 ----
const SRC = {
  gsi5: { url: (z,x,y) => `https://cyberjapandata.gsi.go.jp/xyz/dem5a_png/${z}/${x}/${y}.png`, zmax: 15, zmin: 8, kind: "gsi",
    attr: `標高：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院 標高タイル（DEM5A）</a>を加工して作成` },
  gsi10: { url: (z,x,y) => `https://cyberjapandata.gsi.go.jp/xyz/dem_png/${z}/${x}/${y}.png`, zmax: 14, zmin: 8, kind: "gsi",
    attr: `標高：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院 標高タイル（DEM10B）</a>を加工して作成` },
  tochigi: { url: (z,x,y) => `https://rinya-tochigi.geospatial.jp/2023/rinya/tile/terrainRGB/${z}/${x}/${y}.png`, zmax: 18, zmin: 8, kind: "tochigi",
    attr: `出典：栃木県森林資源データ（2021〜2022年度計測）を加工して作成（<a href="https://www.geospatial.jp/ckan/dataset/dem05_tochigi" target="_blank" rel="noopener">データセット</a>）。栃木県が作成したものではありません。` },
};
const TILE = 256;
const $ = id => document.getElementById(id);

// ---- 設定 ----
const P = {};   // 確定済みの設定（commitParams で更新。画面の値とは「適用」まで一致しない）
const FMT = { maxz: v => "z" + v, sigma: v => v + " m", cscale: v => (10 ** v).toFixed(3), rad: v => v + " m",
  sigc: v => v + " m", ciscale: v => v + " %", op: v => (+v).toFixed(2) };
function updateLabels() { for (const k of Object.keys(FMT)) $(k + "_o").textContent = FMT[k](+$(k).value); }   // 表示値（ラベル）だけ更新。設定は変えない
function commitParams() {   // 画面の値を設定 P に確定する。適用時と初回表示のときだけ呼ぶ
  P.src = $("src").value; P.layer = $("layer").value;
  for (const k of Object.keys(FMT)) P[k] = +$(k).value;
  P.miss = $("miss").checked;
  P.cs0 = 10 ** P.cscale;
  const s = SRC[P.src]; $("maxz").max = s.zmax; if (P.maxz > s.zmax) { P.maxz = s.zmax; $("maxz").value = s.zmax; }
  updateLabels();
  $("attr").innerHTML = s.attr;
  legend();
}
function isDirty() {   // 画面の値が、確定済みの設定と違うか（op は即時反映なので見ない）
  if ($("src").value !== P.src || $("layer").value !== P.layer || $("miss").checked !== P.miss) return true;
  return Object.keys(FMT).some(k => k !== "op" && +$(k).value !== P[k]);
}

// ---- 計測（数字だけ。画像は保存しない）----
const stats = { fetch: [], decode: [], compute: [], draw: [], tiles: 0, hit: 0, miss403: 0, missOther: 0, allTransparent: 0, layerLoadMs: [], applyMs: [], evict: 0 };
function q(a, p) { if (!a.length) return "-"; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(1); }
function showStats() {
  const f = (n, a) => `${n} n=${a.length} 中央${q(a, .5)} p95 ${q(a, .95)} 最大${q(a, 1)} ms`;
  $("stats").textContent = [
    f("標高取得", stats.fetch), f("PNG復号", stats.decode), f("計算(1タイル)", stats.compute), f("描き込み", stats.draw),
    `描画完了までの時間(画面全体) ${stats.layerLoadMs.map(v => v.toFixed(0)).join(", ") || "-"} ms`,
    `適用の所要時間 ${stats.applyMs.map(v => v.toFixed(0)).join(", ") || "-"} ms`,
    `タイル ${stats.tiles} / 標高キャッシュ命中 ${stats.hit} / 欠け: 403=${stats.miss403} 他=${stats.missOther} 全透明=${stats.allTransparent} / 追い出し ${stats.evict}`,
    `UA ${navigator.userAgent.slice(0, 80)}`,
  ].join("\n");
}
function resetStats() { for (const k of ["fetch", "decode", "compute", "draw", "layerLoadMs", "applyMs"]) stats[k] = []; for (const k of ["tiles", "hit", "miss403", "missOther", "allTransparent", "evict"]) stats[k] = 0; showStats(); }
window.__stats = stats;

// ---- 標高タイル（メモリ保持。同じタイルを取り直さない）----
// 値: Promise<Float32Array|null>。null は欠け（403・404・全透明・欠測）。
const elevCache = new Map();
const ELEV_MAX = 240;   // 1枚 256KB → 約60MB。iPhone を考えて控えめ
const cv = document.createElement("canvas"); cv.width = cv.height = TILE;
const cx = cv.getContext("2d", { willReadFrequently: true });
function decodeGsi(d) {
  const out = new Float32Array(TILE * TILE); let valid = 0;
  for (let i = 0, j = 0; i < out.length; i++, j += 4) {
    const x = d[j] * 65536 + d[j + 1] * 256 + d[j + 2];
    if (x === 8388608) out[i] = NaN; else { out[i] = (x < 8388608 ? x : x - 16777216) * 0.01; valid++; }
  }
  return valid ? out : null;
}
function decodeTochigi(d) {
  const out = new Float32Array(TILE * TILE); let valid = 0;
  for (let i = 0, j = 0; i < out.length; i++, j += 4) {
    if (d[j + 3] === 0) out[i] = NaN; else { out[i] = -10000 + (d[j] * 65536 + d[j + 1] * 256 + d[j + 2]) * 0.1; valid++; }
  }
  return valid ? out : null;
}
async function loadElev(src, z, x, y) {
  const n = 2 ** z;
  if (y < 0 || y >= n) return null;
  x = ((x % n) + n) % n;
  const key = `${src}/${z}/${x}/${y}`;
  if (elevCache.has(key)) { stats.hit++; const v = elevCache.get(key); elevCache.delete(key); elevCache.set(key, v); return v; }
  const p = (async () => {
    const t0 = performance.now();
    let res;
    try { res = await fetch(SRC[src].url(z, x, y), { cache: "force-cache" }); } catch (e) { stats.missOther++; return null; }
    if (!res.ok) { if (res.status === 403) stats.miss403++; else stats.missOther++; return null; }
    const blob = await res.blob();
    const t1 = performance.now(); stats.fetch.push(t1 - t0);
    const bmp = await createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" });
    cx.clearRect(0, 0, TILE, TILE); cx.drawImage(bmp, 0, 0); bmp.close();
    const d = cx.getImageData(0, 0, TILE, TILE).data;
    const out = SRC[src].kind === "gsi" ? decodeGsi(d) : decodeTochigi(d);
    if (!out) stats.allTransparent++;
    stats.decode.push(performance.now() - t1);
    return out;
  })();
  elevCache.set(key, p);
  if (elevCache.size > ELEV_MAX) { elevCache.delete(elevCache.keys().next().value); stats.evict++; }
  return p;
}

// ---- 計算 ----
function gaussBlur(a, W, s) {   // 欠け(NaN)を除いた重み付きのならし。中心が欠けなら NaN のまま
  const k = Math.ceil(3 * s), ker = new Float32Array(k + 1);
  for (let i = 0; i <= k; i++) ker[i] = Math.exp(-(i * i) / (2 * s * s));
  const N = W * W, num = new Float32Array(N), den = new Float32Array(N);
  for (let i = 0; i < N; i++) { const v = a[i]; if (v === v) { num[i] = v; den[i] = 1; } }
  const n2 = new Float32Array(N), d2 = new Float32Array(N);
  const pass = (sn, sd, dn, dd, horiz) => {
    const st = horiz ? 1 : W, ls = horiz ? W : 1;   // st=走査方向の歩幅, ls=行(列)の歩幅
    for (let l = 0; l < W; l++) {
      const base = l * ls;
      for (let p = 0; p < W; p++) {
        let sn_ = 0, sd_ = 0;
        const lo = Math.max(0, p - k), hi = Math.min(W - 1, p + k);
        for (let m = lo; m <= hi; m++) { const w = ker[Math.abs(m - p)], i = base + m * st; sn_ += w * sn[i]; sd_ += w * sd[i]; }
        dn[base + p * st] = sn_; dd[base + p * st] = sd_;
      }
    }
  };
  pass(num, den, n2, d2, true);
  pass(n2, d2, num, den, false);
  const out = new Float32Array(N);
  for (let i = 0; i < N; i++) out[i] = a[i] === a[i] ? num[i] / den[i] : NaN;
  return out;
}
function blurM(a, W, sM, px) { const s = sM / px; return s < 0.6 ? a : gaussBlur(a, W, s); }

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
const GRAY = [232, 232, 232], RIDGE = [238, 82, 40], VALLEY = [36, 78, 224];
function divColor(t, out) {   // t: -1(谷)〜+1(尾根)
  const c = t >= 0 ? RIDGE : VALLEY, u = Math.abs(t);
  out[0] = lerp(GRAY[0], c[0], u); out[1] = lerp(GRAY[1], c[1], u); out[2] = lerp(GRAY[2], c[2], u);
}

function computeTile(src, zd, dx, dy, P, grid, M, W, px) {   // grid: (W×W) の標高（欠けは NaN）→ 256×256 の ImageData
  const img = new ImageData(TILE, TILE), o = img.data, c = [0, 0, 0];
  const alpha = 255;   // 不透明度は層の不透明度（layer.setOpacity）で反映する。ここには入れない
  let Zs, Zc, ux, uy, offs, offX, offD, offR, offY;
  if (P.layer === "cs") Zs = blurM(grid, W, P.sigma, px);
  else if (P.layer === "ci") {
    Zc = blurM(grid, W, P.sigc, px);
    // 各升目の下り勾配の向き（単位ベクトル。平らなら 0）
    ux = new Float32Array(W * W); uy = new Float32Array(W * W);
    for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, gx = (Zc[i + 1] - Zc[i - 1]) / (2 * px), gy = (Zc[i + W] - Zc[i - W]) / (2 * px);
      const g = Math.hypot(gx, gy);
      if (g === g && g > 1e-6) { ux[i] = -gx / g; uy[i] = -gy / g; } else if (g !== g) { ux[i] = NaN; }
    }
    // 半径 R の中の見る点（4つの半径 × 16方向）。全升目を舐めると z17・R=60m で重すぎるため間引く
    const Rc = Math.max(P.rad / px, 1.5), list = [];
    for (let r = 1; r <= 4; r++) for (let a = 0; a < 16; a++) {
      const th = (a + (r % 2) * 0.5) * Math.PI / 8, rr = Rc * r / 4;
      list.push([Math.round(rr * Math.cos(th)), Math.round(rr * Math.sin(th))]);
    }
    offs = list.filter(([a, b]) => a || b);
    offY = new Int32Array(offs.length);
    offX = new Int32Array(offs.length); offD = new Int32Array(offs.length); offR = new Float32Array(offs.length);
    offs.forEach(([a, b], k) => { offX[k] = a; offY[k] = b; offD[k] = b * W + a; offR[k] = 1 / Math.hypot(a, b); });
  }
  const RAD = 180 / Math.PI;
  for (let y = 0; y < TILE; y++) for (let x = 0; x < TILE; x++) {
    const i = (y + M) * W + (x + M), j = (y * TILE + x) * 4;
    if (P.layer === "cs") {
      const z0 = Zs[i];
      if (z0 !== z0) { miss(o, j, P); continue; }
      const e = Zs[i + 1], w = Zs[i - 1], n = Zs[i - W], s = Zs[i + W];
      if (e !== e || w !== w || n !== n || s !== s) { miss(o, j, P); continue; }
      const lap = (e + w + n + s - 4 * z0) / (px * px), gx = (e - w) / (2 * px), gy = (s - n) / (2 * px);
      const t = clamp(-lap / P.cs0, -1, 1), sl = Math.atan(Math.hypot(gx, gy)) * RAD;
      divColor(t, c);
      const f = 1 - 0.55 * clamp(sl / 55, 0, 1);
      o[j] = c[0] * f; o[j + 1] = c[1] * f; o[j + 2] = c[2] * f; o[j + 3] = alpha;
    } else {
      if (Zc[i] !== Zc[i] || ux[i] !== ux[i]) { miss(o, j, P); continue; }
      let sum = 0, cnt = 0;
      for (let k = 0; k < offX.length; k++) {
        const ii = i + offD[k], vx = ux[ii], vy = uy[ii];
        if (vx !== vx) continue;
        // 隣の升目の下り向きと、そこから中心へ向かう向きのなす角 θ（0°＝中心へ流れ込む）
        const cs = (vx * -offX[k] + vy * -offY[k]) * offR[k];
        sum += vx === 0 && vy === 0 ? 90 : acosFast(cs) * RAD; cnt++;
      }
      if (!cnt) { miss(o, j, P); continue; }
      const ci = (sum / cnt - 90) / 0.9;   // −100〜+100 %。＋＝発散＝尾根、−＝収束＝谷
      const t = clamp(ci / P.ciscale, -1, 1);
      divColor(t, c);
      o[j] = c[0]; o[j + 1] = c[1]; o[j + 2] = c[2]; o[j + 3] = Math.round(alpha * clamp(0.2 + 1.1 * Math.abs(t), 0, 1));
    }
  }
  return img;
}
function acosFast(v) {   // Abramowitz-Stegun 4.4.45（誤差 約7e-5 rad）
  const a = v < 0 ? -v : v, r = Math.sqrt(1 - (a > 1 ? 1 : a)) * (1.5707288 + a * (-0.2121144 + a * (0.0742610 - a * 0.0187293)));
  return v < 0 ? Math.PI - r : r;
}
function miss(o, j, P) { if (P.miss) { o[j] = 255; o[j + 1] = 0; o[j + 2] = 0; o[j + 3] = 70; } }

// ---- タイルごとの結果（拡大時は同じ標高タイルを複数の表示タイルで共有するので小さく保持）----
let gen = 0;   // 設定が変わるたびに増やす。古い仕事は捨てる
const resCache = new Map(), RES_MAX = 48;
function metersPerPx(z, lat) { return 40075016.686 * Math.cos(lat * Math.PI / 180) / (TILE * 2 ** z); }
function tileLat(z, y) { const n = Math.PI - 2 * Math.PI * (y + 0.5) / 2 ** z; return Math.atan(Math.sinh(n)) * 180 / Math.PI; }

// 1タイルの計算の前に制御をブラウザへ返す（地図のドラッグ・スライダーなどの入力と描画を挟めるようにする）。
// setTimeout(0) を使う理由：requestIdleCallback は iOS Safari に無い。MessageChannel は待ちが無く、タイルの計算が連続したとき描画・入力より先に次の計算が走る可能性がある（Safari では未確認）。
// setTimeout(0) は入れ子で 4ms 以上の下限が付くことがあり、描画・入力に番を譲りやすい。増える待ちの量は findings.md のヘッドレスの測定を参照（実機は未確認）。
// 譲りは1本の列にして直列にする：全タイル分の setTimeout(0) を同時に作ると、先に期限が来た順に連続して走り、あとから期限の来る setInterval などが全タイルの終了まで走れない。
let yieldChain = Promise.resolve();
const yieldToBrowser = () => (yieldChain = yieldChain.then(() => new Promise(resolve => setTimeout(resolve, 0))));
function getResult(zd, dx, dy) {
  const key = `${gen}/${zd}/${dx}/${dy}`;
  if (resCache.has(key)) return resCache.get(key);
  const my = gen, p = (async () => {
    const src = P.src, Pk = { ...P };
    const px = metersPerPx(zd, tileLat(zd, dy));
    // 余白：CS は 3σ、CI は R＋3σc（升目の数）。隣の1周（256升目）まで
    const needM = Math.ceil(Math.max(P.layer === "cs" ? 3 * P.sigma : P.rad + 3 * P.sigc, 0) / px) + 2;
    const M = Math.min(TILE, needM), W = TILE + 2 * M;
    const tiles = await Promise.all([-1, 0, 1].flatMap(oy => [-1, 0, 1].map(ox => loadElev(src, zd, dx + ox, dy + oy).then(t => [ox, oy, t]))));
    if (my !== gen) return null;
    await yieldToBrowser();
    if (my !== gen) return null;   // 譲っている間に世代が変わった（古い仕事）なら、計算せずに捨てる
    const centre = tiles.find(([ox, oy]) => !ox && !oy)[2];
    const t0 = performance.now();
    const grid = new Float32Array(W * W).fill(NaN);
    for (const [ox, oy, t] of tiles) {
      if (!t) continue;
      const x0 = ox < 0 ? TILE - M : 0, x1 = ox > 0 ? M : TILE, y0 = oy < 0 ? TILE - M : 0, y1 = oy > 0 ? M : TILE;   // 取り込む範囲（タイル内）
      const gx0 = ox < 0 ? 0 : ox === 0 ? M : M + TILE, gy0 = oy < 0 ? 0 : oy === 0 ? M : M + TILE;
      for (let y = y0; y < y1; y++) grid.set(t.subarray(y * TILE + x0, y * TILE + x1), (gy0 + y - y0) * W + gx0);
    }
    let cvs;
    if (!centre) {   // 中心のタイルが欠け：全面を「欠け」で塗る
      const img = new ImageData(TILE, TILE);
      if (P.miss) for (let j = 0; j < img.data.length; j += 4) { img.data[j] = 255; img.data[j + 3] = 70; }
      cvs = document.createElement("canvas"); cvs.width = cvs.height = TILE; cvs.getContext("2d").putImageData(img, 0, 0);
    } else {
      const img = computeTile(src, zd, dx, dy, Pk, grid, M, W, px);
      cvs = document.createElement("canvas"); cvs.width = cvs.height = TILE; cvs.getContext("2d").putImageData(img, 0, 0);
      stats.compute.push(performance.now() - t0);
    }
    return cvs;
  })();
  resCache.set(key, p);
  if (resCache.size > RES_MAX) resCache.delete(resCache.keys().next().value);
  return p;
}

// ---- Leaflet ----
const map = L.map("map", { zoomControl: true, maxZoom: 19 });
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", { maxZoom: 18, maxNativeZoom: 18,
  attribution: '地図：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル（淡色）</a>' }).addTo(map);

const Relief = L.GridLayer.extend({
  createTile(coords, done) {
    const tile = document.createElement("canvas"); tile.width = tile.height = TILE;
    if (P.layer === "none") { setTimeout(() => done(null, tile), 0); return tile; }
    const s = SRC[P.src], zd = clamp(Math.min(coords.z, s.zmax, P.maxz), s.zmin, 30), sh = coords.z - zd;
    if (coords.z < s.zmin) { setTimeout(() => done(null, tile), 0); return tile; }
    const sub = 2 ** sh, dx = Math.floor(coords.x / sub), dy = Math.floor(coords.y / sub);
    const my = gen; stats.tiles++;
    getResult(zd, dx, dy).then(cvs => {
      if (my !== gen || !cvs) return done(null, tile);
      const t0 = performance.now(), g = tile.getContext("2d"), sz = TILE / sub;
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
      g.drawImage(cvs, (coords.x % sub) * sz, (coords.y % sub) * sz, sz, sz, 0, 0, TILE, TILE);
      stats.draw.push(performance.now() - t0);
      done(null, tile);
    }).catch(e => { console.error(e); done(e, tile); });
    return tile;
  },
});
commitParams();
const layer = new Relief({ tileSize: TILE, minZoom: 8, maxZoom: 19, opacity: P.op, updateWhenZooming: false, keepBuffer: 1 }).addTo(map);
let tLoad = 0;
layer.on("loading", () => { tLoad = performance.now(); });
layer.on("load", () => {
  if (tLoad) { stats.layerLoadMs.push(performance.now() - tLoad); tLoad = 0; showStats(); }
  finishApply(false);
  setBusy(false);
});

function legend() {
  const g = P.layer === "ci" ? `linear-gradient(90deg, rgb(${VALLEY}), rgb(${GRAY}), rgb(${RIDGE}))` : `linear-gradient(90deg, rgb(${VALLEY}), rgb(${GRAY}), rgb(${RIDGE}))`;
  $("lg").style.background = g; $("lg").style.display = P.layer === "none" ? "none" : "flex";
  $("lgnote").textContent = P.layer === "cs" ? "谷（青）← 曲率 → 尾根（赤）。急な斜面ほど暗い" : P.layer === "ci" ? "収束＝谷（−・青）← CI → 発散＝尾根（＋・赤）" : "";
}
const BUSY_TIMEOUT_MS = 60000;   // redraw から load が来ないまま、これだけ経ったらボタンを元に戻す（保険）
let busyTimer = 0;
function setBusy(on) {   // 計算中は「適用」を押せなくする（進行中の計算は止められないので、連打による重なりを防ぐ）
  clearTimeout(busyTimer);
  const b = $("apply"); b.disabled = on; b.textContent = on ? "計算中…" : "適用";
  b.classList.toggle("dirty", !on && isDirty());
}
// 適用の所要時間：クリックから load まで。計算中は画面が更新されないので、動く秒数表示は作らない（終わってからの確定値だけ出す）
let tClick = 0;   // 0 のときは記録しない（適用以外の load＝パンなどでは記録しない。記録したら 0 に戻す）
function finishApply(timeout) {
  if (!tClick) return;
  if (timeout) $("applyTime").textContent = "前回の適用：未完了（タイムアウト）";
  else { const ms = performance.now() - tClick; stats.applyMs.push(ms); $("applyTime").textContent = `前回の適用：${(ms / 1000).toFixed(1)} 秒`; showStats(); }
  tClick = 0;
}
function applyParams() {   // 「適用」を押したときだけ：設定を確定 → 古い結果を捨てる → 1回だけ再描画
  if ($("apply").disabled) return;   // 無効中のクリックは無視（時刻も記録しない）
  tClick = performance.now();
  commitParams(); gen++; resCache.clear();
  setBusy(true);
  // 「計算中…」が画面に描かれてから重い計算を始めるため、2フレーム待つ
  requestAnimationFrame(() => requestAnimationFrame(() => {
    layer.redraw();
    busyTimer = setTimeout(() => { finishApply(true); setBusy(false); }, BUSY_TIMEOUT_MS);
  }));
}
$("src").addEventListener("input", () => { $("maxz").max = SRC[$("src").value].zmax; $("maxz").value = SRC[$("src").value].zmax; });
// 入力は表示値の更新と「未適用」の印だけ。不透明度だけは即時に反映する（再計算しない）
document.querySelectorAll("#panel select, #panel input").forEach(e => e.addEventListener("input", () => {
  updateLabels();
  if (e.id === "op") { P.op = +e.value; layer.setOpacity(P.op); } else $("apply").classList.toggle("dirty", isDirty());
}));
$("apply").addEventListener("click", applyParams);
document.querySelectorAll("button[data-v]").forEach(b => b.addEventListener("click", () => { const [a, o, z] = b.dataset.v.split(",").map(Number); map.setView([a, o], z); }));
$("reset").addEventListener("click", resetStats);
// コピーの手順（上から順に試し、成功したら止める）：a. Clipboard API（https か localhost のときだけ使える）→ b. textarea＋execCommand（http の iOS Safari 向け）→ c. prompt で手動コピー
function copyText(text) {
  const done = how => { $("copyMsg").textContent = `コピーしました（${how}）`; };
  const viaExec = () => {
    const ta = document.createElement("textarea");   // readOnly にしない（iOS Safari で選択できなくなる）
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;font-size:16px";   // 画面外。16px は iOS の自動ズーム防止
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, 99999);
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  };
  const fallback = () => { if (viaExec()) done("b：execCommand"); else prompt("コピーしてください", text); };
  $("copyMsg").textContent = "";
  if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done("a：Clipboard API"), fallback);
  else fallback();
}
$("copy").addEventListener("click", () => {
  const r = a => ({ n: a.length, median: +q(a, .5), p95: +q(a, .95), max: +q(a, 1) });
  const j = JSON.stringify({ src: P.src, layer: P.layer, maxz: P.maxz, sigma: P.sigma, rad: P.rad, z: map.getZoom(), fetch: r(stats.fetch), decode: r(stats.decode),
    compute: r(stats.compute), draw: r(stats.draw), layerLoadMs: stats.layerLoadMs, applyMs: stats.applyMs, viewport: [innerWidth, innerHeight], ua: navigator.userAgent });
  copyText(j);
});
// 位置は URL のハッシュに（#lat,lng,z）
function fromHash() { const m = location.hash.slice(1).split(",").map(Number); return m.length === 3 && m.every(isFinite) ? m : [36.7656, 139.4937, 15]; }
{ const [a, o, z] = fromHash(); map.setView([a, o], z); }
map.on("moveend", () => history.replaceState(null, "", `#${map.getCenter().lat.toFixed(5)},${map.getCenter().lng.toFixed(5)},${map.getZoom()}`));
setInterval(showStats, 1000);
updateLabels(); resetStats();
window.map = map; window.layer = layer; window.applyParams = applyParams;
</script>
</body>
</html>
