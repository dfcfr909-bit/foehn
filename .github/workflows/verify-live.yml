name: 公開URLの検証

# デプロイされたものが本当に期待どおりかを、公開URLに対して確かめる。
#
# なぜ要るか:
#   スモークテスト（test.yml）は**手元のHTMLを読み込んで通信をスタブする**ので、
#   「デプロイされたか」「外部APIが実際に叩けるか」は一切分からない。
#   #27 では「標高が出ない」の原因が不具合ではなく**未マージ**だった、という
#   往復が2回起きた。ここを機械で潰す。
#
# ⚠ **実機確認の代わりにはならない。** iOS Safari とホーム画面のPWAは
#    Chromium とは別物で、このリポジトリはiOS特有の不具合を2回踏んでいる。
#
# ジョブを2つに分けてある。**性質がまったく違うため。**
#
#   deliver … 配信物の sha256 照合。**外部を1つも叩かない**（GitHub Pages のみ）。
#             赤は必ず「本当に配信されていない」を意味する。毎デプロイで自動。
#             Chromium も npm install も要らないので数十秒で終わる
#   browser … 実ブラウザ＋Nominatim・地理院の疎通。**外部を実際に叩く**ので
#             **手動実行のみ**
#
# ⚠ **browser を workflow_run（毎デプロイ）に広げないこと。**
#    Nominatim の制限はIP単位で、Actions のランナーは他人のCIと共有の(Azure)IPを使う。
#    こちらの行儀と無関係に絞られうるので、自動で回すと
#    **「赤いが直すところが無い」通知**が定期的に出る。
#    赤の意味が「壊した／相手が落ちた／IPが絞られた」に割れた検査は、
#    そのうち誰も見なくなる。**定期実行（schedule）も足さないこと。**
on:
  workflow_run:
    workflows: ["Pages へデプロイ"]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: '検証するURL（既定は公開URL）'
        required: false
        default: 'https://dfcfr909-bit.github.io/foehn/sotoki_v4.html'

permissions:
  contents: read

env:
  LIVE_URL: ${{ inputs.url || 'https://dfcfr909-bit.github.io/foehn/sotoki_v4.html' }}

jobs:
  # ---- ① 配信物の同一性（毎デプロイ・外部を叩かない） ----
  deliver:
    name: 配信物の同一性
    runs-on: ubuntu-latest
    # デプロイが失敗していたら見に行っても意味がない
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # ⚠ **配信物と比べる相手は「デプロイされたコミット」でなければならない。**
      #    既定の checkout だと workflow_run の元コミットが取れず、
      #    「一致しない」と嘘の失敗を出す。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Pages の配信が行き渡るまで少し待つ（デプロイ直後は古いものが返ることがある）
      - name: 反映を待つ
        if: github.event_name == 'workflow_run'
        run: sleep 30

      # ⚠ npm install も Chromium も要らない（--only=deploy は Node の標準機能だけ）。
      #    足すと軽さが失われるので、必要になっても browser ジョブ側に足すこと。
      - name: 配信物を照合
        working-directory: tests
        run: node verify-live.mjs "$LIVE_URL" --only=deploy | tee result.txt

      - name: 結果をサマリーへ
        if: always()
        run: |
          {
            echo '## ① 配信物の同一性'
            echo
            echo '```'
            cat tests/result.txt 2>/dev/null || echo '（出力なし）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- ② 実ブラウザでの起動と外部の疎通（手動実行のみ） ----
  browser:
    name: 実ブラウザと外部の疎通
    runs-on: ubuntu-latest
    # ⚠ **ここを外して毎デプロイに戻さないこと。** 理由は先頭の注記のとおり。
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: 依存を取得
        working-directory: tests
        run: npm install

      # ⚠ **手順をここに書き写さないこと**（PW_CHROMIUM まで含めて共通アクションが持つ）
      - name: Chromium を用意
        uses: ./.github/actions/chromium

      - name: 実ブラウザで検証
        working-directory: tests
        run: node verify-live.mjs "$LIVE_URL" --only=browser | tee result.txt

      - name: 結果をサマリーへ
        if: always()
        run: |
          {
            echo '## ② 実ブラウザでの起動と外部の疎通'
            echo
            echo '```'
            cat tests/result.txt 2>/dev/null || echo '（出力なし）'
            echo '```'
            echo
            echo '⚠ これは実機確認の代わりではない。iOS Safari とホーム画面のPWAは別途。'
          } >> "$GITHUB_STEP_SUMMARY"
