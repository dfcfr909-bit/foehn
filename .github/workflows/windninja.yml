name: 風の細分化の表を作る（WindNinja・試作）

# 山域ごとに WindNinja（質量保存の解法）を風向16方位で解き、「範囲の平均の地上10m風の何倍か・何度曲がるか」の表を作って
# コミットする（experiments/windninja/README.md「段3の計画」）。端末での使い方は案A（判定の風 × 倍率 ÷ 選択地点の倍率）。
#
# ⚠ 試作の間は experiments/windninja/tables/ に置く（Pages は experiments/ を配らない）。
# ⚠ 手動実行のみ。地形は変わらないので定期実行は足さない（地理院を無駄に叩かない）。
# ⚠ 実行したブランチにコミットする（poi.yml・terrain-ref.yml と同じ形）。
# ⚠ 作り方（スクリプト）を変えた push でも走る。新しいワークフローは main に入るまで手動実行できないため。
#   main では走らせない（マージのたびに作り直してコミットしない）。
# ⚠ WindNinja はタグを固定してビルドする（米国林野局・パブリックドメイン＋BSD）。外へ問い合わせる機能は切る（PHONE_HOME_QUERIES=OFF）
on:
  workflow_dispatch:
    inputs:
      area:
        description: '山域の id（areas.json）'
        required: true
        default: tanigawa
  push:
    branches-ignore: [main]
    paths:
      - scripts/windninja/buildWindTable.py
      - .github/workflows/windninja.yml

permissions:
  contents: write

concurrency:
  group: windninja
  cancel-in-progress: false

env:
  WINDNINJA_TAG: 4.0.0

jobs:
  build:
    name: 作る
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: 依存を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config cmake g++ libboost-program-options-dev libboost-date-time-dev libboost-test-dev \
            libshp-dev libgdal-dev gdal-bin libnetcdf-dev libcurl4-openssl-dev python3-numpy python3-pil > /dev/null

      - name: WindNinja の控え
        id: wncache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wn
          key: windninja-${{ env.WINDNINJA_TAG }}-${{ runner.os }}-ubuntu-noble-v1

      - name: WindNinja をビルド（CLI だけ）
        if: steps.wncache.outputs.cache-hit != 'true'
        run: |
          WN="$RUNNER_TEMP/wn"
          git clone --depth 1 --branch "$WINDNINJA_TAG" https://github.com/firelab/windninja.git "$WN/src"
          mkdir -p "$WN/build" && cd "$WN/build"
          cmake -DNINJA_GUI=OFF -DNINJAFOAM=OFF -DPHONE_HOME_QUERIES=OFF -DSUPRESS_WARNINGS=ON -DCMAKE_BUILD_TYPE=Release ../src > cmake.log
          make -j"$(nproc)" WindNinja_cli > make.log 2>&1 || { tail -60 make.log; exit 1; }

      # ⚠ shell: bash を明示する（pipefail が付く）。付けないと tee が失敗を飲み込み、欠けた表までコミットしてしまう
      - name: 表を作る
        shell: bash
        env:
          WINDNINJA_VERSION: ${{ env.WINDNINJA_TAG }}
        run: |
          WN="$RUNNER_TEMP/wn"
          AREA="${{ github.event.inputs.area || 'tanigawa' }}"
          python3 scripts/windninja/buildWindTable.py "$AREA" "$WN/build/src/cli/WindNinja_cli" "$WN/src/data" "$RUNNER_TEMP/work" experiments/windninja/tables | tee result.txt

      # ⚠ main では手動実行してもコミットしない（main へ直接 push しない・CLAUDE.md）。表はブランチで作って PR で入れる
      - name: 変わっていればコミット
        if: github.ref != 'refs/heads/main'
        run: |
          git add experiments/windninja/tables
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 風の細分化の表を生成 (自動生成)"
          git push

      - name: 結果をサマリーへ
        if: always()
        run: |
          {
            echo '## 風の細分化の表（WindNinja）'
            echo
            echo '```'
            cat result.txt 2>/dev/null || echo '（出力なし）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
