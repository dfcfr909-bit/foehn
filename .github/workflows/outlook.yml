name: AI全国概況の生成

# 1日2回（JST 06:00 / 18:00）＋手動実行。outlook.json を生成してコミット。
on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST（前日21:00 UTC）
    - cron: '0 9 * * *'    # 18:00 JST（09:00 UTC）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: outlook
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Generate outlook.json
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          OUTLOOK_MODEL: ${{ vars.OUTLOOK_MODEL || 'glm-4.6' }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
        run: node scripts/gen-outlook.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- outlook.json; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outlook.json
          git commit -m "chore: AI全国概況を更新 (自動生成)"
          git push
