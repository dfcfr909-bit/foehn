name: 山頂座標の検査

# areas.json の座標が本当に山頂を指しているか調べる（#13）。
# 手動実行のみ。結果は Actions のログとサマリーに出るだけで、何もコミットしない。
#
# なぜ Actions で回すか:
#   開発環境からは国土地理院に到達できず、手元では走らせられない（#8 と同じ制約）。
#   Actions なら外に出られるうえ、**スマホからでも実行できる**。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=ズレを洗い出す / snap=修正案を出す / search=地名検索と突き合わせる'
        required: false
        default: 'check'
        type: choice
        options: [check, snap, search]
      tol:
        description: '許容差(m)。これを超える差を「要確認」として出す。200では笙ヶ岳級のズレを通す'
        required: false
        default: '100'
      radius:
        description: 'snapの探索半径(km)。既定6では届かない峰がある（大朝日岳・皇海山など）'
        required: false
        default: '6'
      match:
        description: 'snapで「山頂と一致」とみなす標高差(m)。既定15。尖った山頂はDEMが低く読むので広げる'
        required: false
        default: '15'
      # ⚠ 選択肢に on/off・yes/no を使わないこと。YAMLが真偽値として解釈するため
      #    許可値の一覧が空になり、workflow_dispatch が422で弾かれる。
      scope:
        description: 'snapの対象。changed=ズレている峰だけ / all=全110峰'
        required: false
        default: 'changed'
        type: choice
        options: [changed, all]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # 差が見つかると exit 1 で終わるので、結果を握ってサマリーに出す。
      # ⚠ 失敗扱いにしないこと。「要確認が見つかった」は正常な結果であって、
      #    ワークフローの故障ではない。赤くすると次から誰も回さなくなる。
      - name: 座標を検査
        if: inputs.mode == 'check'
        run: |
          set +e
          node scripts/checkPeaks.mjs --tol "${{ inputs.tol }}" | tee result.txt
          exit 0

      # 修正案を出すだけ。**--write は付けない**（勝手に areas.json を書き換えない）。
      # 出た座標は人が見てから適用する。同じ標高の別の峰に吸着する可能性があるため
      - name: 山頂へ吸着させた修正案
        if: inputs.mode == 'snap'
        run: |
          set +e
          node scripts/snapPeaks.mjs --tol "${{ inputs.tol }}" --radius "${{ inputs.radius }}" \
            --match "${{ inputs.match }}" ${{ inputs.scope == 'all' && '--all' || '' }} | tee result.txt
          exit 0

      # 名前から座標を引いて「そもそも別の山を指していないか」を見る。
      # ⚠ 標高の根拠にはしない（地名の代表点は最高地点とは限らない）。
      - name: 地名検索と突き合わせ
        if: inputs.mode == 'search'
        run: |
          set +e
          node scripts/searchPeaks.mjs | tee result.txt
          exit 0

      - name: 結果をサマリーへ
        run: |
          {
            echo '## 山頂座標の検査結果'
            echo
            echo '```'
            cat result.txt
            echo '```'
            echo
            echo '座標を直すときは **`lat`/`lon` を直すこと。`elev` を下げて辻褄を合わせない**。'
            echo 'snap の修正案は**提案**であって自動適用しない。移動距離の大きいものは'
            echo '地図で目視確認すること（同じ標高の別の峰に吸着している可能性がある）。'
            echo '手で読み取りたいときは、アプリの地図で山頂を長押しすると下段に座標が出る。'
          } >> "$GITHUB_STEP_SUMMARY"
