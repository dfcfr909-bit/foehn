name: CS立体図の配信を調べる（実験）

# 県版の CS立体図（G空間情報センター）の XYZ タイルの URL・ズーム範囲・利用条件を調べる（#112・#10）。
# ⚠ 調べるだけ。何も変えない・何もコミットしない。
# ⚠ 調査用ブランチ claude/csmap-probe だけで走らせる（main には入れない）。
on:
  push:
    branches: [claude/csmap-probe]
    paths:
      - scripts/probeCsmap.mjs
      - .github/workflows/probe-csmap.yml

permissions:
  contents: read

jobs:
  probe:
    name: 調べる
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: 調べる
        shell: bash
        run: node scripts/probeCsmap.mjs | tee result.txt
      # 栃木県の利用規約（PDF）の本文を読む（リソース「栃木県_利用規約」）
      - name: 利用規約を読む
        continue-on-error: true
        shell: bash
        run: |
          (command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)) >/dev/null
          curl -sSfL -o terms.pdf 'https://www.geospatial.jp/ckan/dataset/486b4a66-6f9b-4327-b841-87e83b5c131a/resource/4dffe2ac-511f-49eb-87c4-29c936ed2cb7/download/.pdf'
          { echo; echo '## ② 栃木県_利用規約（PDF の本文）'; pdftotext -layout terms.pdf - ; } | tee -a result.txt
      - name: 結果をサマリーへ
        if: always()
        run: |
          {
            echo '## CS立体図の配信'
            echo
            echo '```'
            cat result.txt 2>/dev/null || echo '（出力なし）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
