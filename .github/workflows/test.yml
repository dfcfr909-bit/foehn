name: スモークテスト

# PRごとに tests/run-all.js を回す。
# Netlify のデプロイプレビューを廃止した代わりのCIチェック → docs/adr/0008-remove-netlify.md
#
# ⚠ プレビューと違って「見た目」は検証しない。実機確認は別途、マージ後に公開URLで行う。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  # 他のワークフローから呼べるようにする。
  # ⚠ **同じ手順を書き写さないため。** release.yml に Chromium の用意を書き写したとき、
  #    それを落として「タグを打つ」が落ちた（実際に踏んだ 2026-08-20）。
  #    テストの走らせ方が要るワークフローは、書き写さずにこれを呼ぶこと。
  workflow_call: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: 依存を取得
        working-directory: tests
        run: npm install

      # 開発環境では /opt/pw-browsers/chromium が同梱されているが、ランナーには無い。
      # ⚠ **手順をここに書き写さないこと**（PW_CHROMIUM まで含めて共通アクションが持つ）
      - name: Chromium を用意
        uses: ./.github/actions/chromium

      - name: 全件実行
        working-directory: tests
        run: node run-all.js

  # ---- 版数の上げ忘れを見つける ----
  # ⚠ **タグ打ちを自動にしたぶんの穴をここで塞ぐ。**
  #   これまでは「版数を手で打って HTML と突き合わせる」二重入力が
  #   打ち間違いと**上げ忘れ**の両方を止めていた。人が打たなくなると
  #   打ち間違いは消えるが、上げ忘れは残る。残る方をここで見る。
  # ⚠ PR のときだけ走らせる。main への push や release.yml から呼ばれたときは
  #   比較先が自分自身になり、意味がない。
  bump:
    name: 版数が上がっているか
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # ⚠ 既定の checkout は浅いので、比較先の中身が手元に無い。
      #   1コミットだけ取れば `git show` で読める。
      - name: 比較先を取る
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: git fetch --depth=1 origin "$BASE"

      - run: node scripts/checkVersionBump.mjs FETCH_HEAD
