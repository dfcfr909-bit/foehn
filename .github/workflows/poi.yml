name: 施設データ（OSM）を作る

# 地図の「施設（OSM）」レイヤーのデータ data/poi.json を作ってコミットする（#199）。
# areas.json の山域ごとに Overpass API（OpenStreetMap）から登山口・駐車場・山小屋・
# トイレ・水場・温泉・店を取り出す。データは ODbL 1.0（© OpenStreetMap contributors）。
#
# ⚠ 開発環境から Overpass へは到達できないので、ここで作る。
# ⚠ 手動実行のみ。定期実行は足さない（相手は公共の無料API。無駄に叩かない）。
# ⚠ 実行したブランチにコミットする（terrain-ref.yml と同じ形）。
# ⚠ 作り方（スクリプト）を変えた push でも走る。新しいワークフローは main に入るまで
#   手動実行できないため。main では走らせない（マージのたびに作り直してコミットしない）。
on:
  workflow_dispatch: {}
  push:
    branches-ignore: [main]
    paths:
      - scripts/buildPoi.mjs

permissions:
  contents: write

concurrency:
  group: poi
  cancel-in-progress: false

jobs:
  build:
    name: 作る
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # ⚠ shell: bash を明示する（pipefail が付く）。付けないと tee が失敗を飲み込み、
      #   取れなかった山域がある欠けたデータまでコミットしてしまう
      - name: 施設データを作る
        shell: bash
        run: node scripts/buildPoi.mjs | tee result.txt

      - name: 変わっていればコミット
        run: |
          if git diff --quiet -- data/poi.json && git ls-files --error-unmatch data/poi.json >/dev/null 2>&1; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poi.json
          git commit -m "chore: 施設データ（OSM）を生成 (自動生成)"
          git push

      - name: 結果をサマリーへ
        if: always()
        run: |
          {
            echo '## 施設データ（OSM）'
            echo
            echo '```'
            cat result.txt 2>/dev/null || echo '（出力なし）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
